# Upptime configuration — full reference
# Docs: https://upptime.js.org/docs/configuration

# ─── Required ──────────────────────────────────────────────────────────────
owner: graphitex-be # GitHub organization or username where this repo lives
repo: status # Name of this repository

# ─── Monitored endpoints ─────────────────────────────────────────────────────
sites:
  - name: Graphitex.com
    url: https://graphitex.com/actuator/health
    # slug: graphitex-com          # Unique id (auto-generated from name if omitted)
    # method: GET                  # HTTP verb (default GET)
    # headers:                     # Custom request headers ($SECRET refs allowed)
    #   - "Authorization: Bearer $SECRET_TOKEN"
    # body: '{"key": "value"}'     # Request payload
    expectedStatusCodes:
      - 200
    maxResponseTime: 5000 # ms before status is "degraded"
    # icon: https://graphitex.com/favicon.ico
    # assignees:                   # Per-site downtime issue assignees
    #   - Fllorent0D
    # __dangerous__body_down_if_text_missing: '"status":"UP"'

  - name: Graphitex Admin
    url: https://admin.graphitex.be/actuator/health
    expectedStatusCodes:
      - 200
    maxResponseTime: 5000
    # __dangerous__body_down_if_text_missing: '"status":"UP"'

# ─── Global options ──────────────────────────────────────────────────────────
user-agent: Fllorent0D # Sent with GitHub API requests
delay: 2000 # ms between endpoint checks
# runner: ubuntu-latest          # GitHub Actions runner (or self-hosted)

# Skip repo metadata auto-updates (optional)
# skipDescriptionUpdate: false
# skipTopicsUpdate: false
# skipHomepageUpdate: false
# skipDeleteIssues: false

# Users assigned to all downtime issues
assignees:
  - Fllorent0D

# ─── Status website ──────────────────────────────────────────────────────────
status-website:
  name: Graphitex status
  # cname: status.graphitex.be   # Custom domain (CNAME)
  # baseUrl: /status             # Use when on GitHub Pages without custom domain
  logoUrl: https://raw.githubusercontent.com/upptime/upptime.js.org/master/static/img/icon.svg
  # favicon: https://graphitex.com/favicon.png
  # faviconSvg: https://graphitex.com/logo.svg
  introTitle: "**Graphitex** service status"
  introMessage: "Real-time and historical uptime data for Graphitex services."
  theme: light # light | dark | night | ocean
  # themeUrl: https://example.com/custom-theme.css
  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/$OWNER/$REPO
  # customHeadHtml: ""
  # customBodyHtml: ""
  # customFootHtml: ""
  # scripts:
